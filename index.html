<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المولّد العالمي لأرقام الهواتف | Universal Phone Number Generator</title>
    <style>
        :root {
            --bg: #0f1119;
            --surface: #1a1d2b;
            --surface2: #222636;
            --border: #2a2e3d;
            --text: #e2e4ec;
            --text2: #a8adb8;
            --accent: #5b8def;
            --accent2: #4f7ce0;
            --green: #34c759;
            --red: #ff4757;
            --orange: #ff9f43;
            --purple: #a55eea;
            --gold: #ffc048;
            --arab: #10b981;
            --europe: #5b8def;
            --asia: #f97316;
            --americas: #a55eea;
            --africa: #eab308;
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 12px 48px rgba(0, 0, 0, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Tajawal', 'Cairo', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(91, 141, 239, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 60%, rgba(16, 185, 129, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 90%, rgba(249, 115, 22, 0.04) 0%, transparent 60%);
        }

        .app-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 20px 40px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 28px 20px 10px;
        }
        .header .icon-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .header .globe-icon {
            font-size: 42px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #5b8def, #10b981, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .header .subtitle {
            color: var(--text2);
            font-size: 0.9rem;
            margin-top: 2px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin: 8px 0 18px;
        }
        .stat-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.8rem;
            color: var(--text2);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stat-chip .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.arab {
            background: var(--arab);
        }
        .dot.europe {
            background: var(--europe);
        }
        .dot.asia {
            background: var(--asia);
        }
        .dot.americas {
            background: var(--purple);
        }
        .dot.africa {
            background: var(--africa);
        }

        /* Main Card */
        .main-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        /* Region Tabs */
        .region-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            justify-content: center;
        }
        .region-tab {
            padding: 9px 16px;
            border-radius: 24px;
            border: 1.5px solid var(--border);
            background: var(--surface2);
            color: var(--text2);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: var(--transition);
            white-space: nowrap;
            user-select: none;
        }
        .region-tab:hover {
            border-color: #555;
            color: #fff;
            transform: translateY(-1px);
        }
        .region-tab.active {
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        }
        .region-tab.active.arab {
            background: #10b981;
            border-color: #10b981;
        }
        .region-tab.active.europe {
            background: #5b8def;
            border-color: #5b8def;
        }
        .region-tab.active.asia {
            background: #f97316;
            border-color: #f97316;
        }
        .region-tab.active.americas {
            background: #a55eea;
            border-color: #a55eea;
        }
        .region-tab.active.africa {
            background: #eab308;
            border-color: #eab308;
            color: #1a1a1a;
        }
        .region-tab .count {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-right: 4px;
        }

        /* Search */
        .search-wrapper {
            position: relative;
            margin-bottom: 18px;
        }
        .search-input {
            width: 100%;
            padding: 13px 44px 13px 16px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 0.95rem;
            transition: var(--transition);
            font-family: inherit;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(91, 141, 239, 0.12);
        }
        .search-input::placeholder {
            color: #5a5f6e;
        }
        .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            color: var(--text2);
            pointer-events: none;
        }
        .search-clear {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text2);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 8px;
            border-radius: 50%;
            transition: var(--transition);
            display: none;
        }
        .search-clear.visible {
            display: block;
        }
        .search-clear:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        /* Country Selector */
        .country-selector {
            position: relative;
            margin-bottom: 16px;
        }
        .selected-country {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            background: var(--surface2);
            cursor: pointer;
            transition: var(--transition);
            min-height: 50px;
        }
        .selected-country:hover {
            border-color: #555;
        }
        .selected-country .flag-area {
            font-size: 1.6rem;
            width: 36px;
            text-align: center;
            flex-shrink: 0;
        }
        .selected-country .info {
            flex: 1;
            min-width: 0;
        }
        .selected-country .name-ar {
            font-weight: 700;
            font-size: 0.95rem;
        }
        .selected-country .name-en {
            font-size: 0.75rem;
            color: var(--text2);
        }
        .selected-country .code-badge {
            background: var(--accent);
            color: #fff;
            padding: 4px 10px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .dropdown-arrow {
            font-size: 0.7rem;
            color: var(--text2);
            transition: var(--transition);
            flex-shrink: 0;
        }
        .dropdown-arrow.open {
            transform: rotate(180deg);
            color: #fff;
        }

        /* Dropdown List */
        .country-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 6px;
            background: var(--surface2);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            max-height: 340px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: var(--shadow-lg);
        }
        .country-dropdown.show {
            display: block;
            animation: dropIn 0.2s ease;
        }
        @keyframes dropIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .country-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 16px;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        .country-option:last-child {
            border-bottom: none;
        }
        .country-option:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .country-option.selected {
            background: rgba(91, 141, 239, 0.12);
            color: #fff;
        }
        .country-option .flag-area {
            font-size: 1.4rem;
            width: 32px;
            text-align: center;
            flex-shrink: 0;
        }
        .country-option .info {
            flex: 1;
            min-width: 0;
        }
        .country-option .name-ar {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .country-option .name-en {
            font-size: 0.7rem;
            color: var(--text2);
        }
        .country-option .code-badge {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text2);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            flex-shrink: 0;
        }
        .country-option .region-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .no-results {
            padding: 20px;
            text-align: center;
            color: var(--text2);
            font-size: 0.9rem;
        }

        /* Settings Row */
        .settings-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 16px;
        }
        .setting-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .setting-label {
            font-size: 0.8rem;
            color: var(--text2);
            font-weight: 600;
            white-space: nowrap;
        }
        .quantity-chips {
            display: flex;
            gap: 5px;
        }
        .qty-chip {
            padding: 7px 13px;
            border-radius: 18px;
            border: 1.5px solid var(--border);
            background: var(--surface2);
            color: var(--text2);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: var(--transition);
            user-select: none;
        }
        .qty-chip:hover {
            border-color: #555;
            color: #fff;
        }
        .qty-chip.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .format-select {
            padding: 8px 12px;
            border-radius: 18px;
            border: 1.5px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
            min-width: 160px;
        }
        .format-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Generate Button */
        .btn-generate {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-sm);
            border: none;
            background: linear-gradient(135deg, #5b8def, #4a78d9);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.3px;
            font-family: inherit;
            box-shadow: 0 4px 18px rgba(91, 141, 239, 0.3);
        }
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(91, 141, 239, 0.4);
            background: linear-gradient(135deg, #6b9df5, #5586e5);
        }
        .btn-generate:active {
            transform: scale(0.98);
        }
        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Results */
        .results-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            display: none;
        }
        .results-card.visible {
            display: block;
            animation: fadeUp 0.35s ease;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }
        .results-title {
            font-weight: 700;
            font-size: 1.05rem;
        }
        .btn-copy-all {
            padding: 9px 18px;
            border-radius: 20px;
            border: 1.5px solid var(--green);
            background: rgba(52, 199, 89, 0.1);
            color: var(--green);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-copy-all:hover {
            background: rgba(52, 199, 89, 0.2);
            transform: translateY(-1px);
        }
        .btn-copy-all.copied {
            background: var(--green);
            color: #fff;
        }
        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
            padding: 4px;
        }
        .number-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            transition: var(--transition);
            gap: 8px;
        }
        .number-row:hover {
            border-color: #555;
            background: #252a3a;
        }
        .number-text {
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', 'Courier New', monospace;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            direction: ltr;
            text-align: left;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #e8eaf0;
        }
        .btn-copy-one {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text2);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            transition: var(--transition);
            flex-shrink: 0;
            font-family: inherit;
        }
        .btn-copy-one:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.25);
        }
        .btn-copy-one.copied {
            background: var(--green);
            border-color: var(--green);
            color: #fff;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #2a2e3d;
            color: #fff;
            padding: 12px 24px;
            border-radius: 24px;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 999;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            border-color: var(--green);
            background: #1a3a2a;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3e4d;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4a4e5d;
        }

        /* Mobile */
        @media (max-width: 640px) {
            .header h1 {
                font-size: 1.5rem;
            }
            .numbers-grid {
                grid-template-columns: 1fr;
                max-height: 420px;
            }
            .settings-row {
                flex-direction: column;
                align-items: stretch;
            }
            .region-tabs {
                gap: 5px;
            }
            .region-tab {
                padding: 7px 11px;
                font-size: 0.75rem;
            }
            .main-card {
                padding: 16px;
            }
            .results-card {
                padding: 14px 16px;
            }
            .qty-chip {
                padding: 6px 10px;
                font-size: 0.75rem;
            }
            .format-select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="icon-row">
                <span class="globe-icon">🌍</span>
            </div>
            <h1>المولّد العالمي لأرقام الهواتف</h1>
            <p class="subtitle">Universal Phone Number Generator • 80+ دولة • بادئات شبكات فعلية</p>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <span class="stat-chip"><span class="dot arab"></span> العالم العربي ٢٠</span>
            <span class="stat-chip"><span class="dot europe"></span> أوروبا ٢٥</span>
            <span class="stat-chip"><span class="dot asia"></span> آسيا ٢٠</span>
            <span class="stat-chip"><span class="dot americas"></span> أمريكا ١٢</span>
            <span class="stat-chip"><span class="dot africa"></span> أفريقيا ١٥</span>
            <span class="stat-chip">📊 المجموع ٩٢ دولة</span>
        </div>

        <!-- Main Card -->
        <div class="main-card">
            <!-- Region Tabs -->
            <div class="region-tabs" id="regionTabs">
                <button class="region-tab active arab" data-region="all">🌐 الكل <span class="count">92</span></button>
                <button class="region-tab arab" data-region="arab">🕌 العالم العربي <span class="count">20</span></button>
                <button class="region-tab europe" data-region="europe">🏰 أوروبا <span class="count">25</span></button>
                <button class="region-tab asia" data-region="asia">🏯 آسيا <span class="count">20</span></button>
                <button class="region-tab americas" data-region="americas">🗽 أمريكا <span class="count">12</span></button>
                <button class="region-tab africa" data-region="africa">🦁 أفريقيا <span class="count">15</span></button>
            </div>

            <!-- Search -->
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="searchInput"
                placeholder="ابحث باسم الدولة (عربي / English) أو رمز الاتصال...">
                <button class="search-clear" id="searchClear">✕</button>
            </div>

            <!-- Country Selector -->
            <div class="country-selector" id="countrySelector">
                <div class="selected-country" id="selectedCountry">
                    <span class="flag-area">🇸🇦</span>
                    <span class="info">
                        <span class="name-ar">السعودية</span>
                        <span class="name-en">Saudi Arabia</span>
                    </span>
                    <span class="code-badge">+966</span>
                    <span class="dropdown-arrow" id="dropdownArrow">▼</span>
                </div>
                <div class="country-dropdown" id="countryDropdown"></div>
            </div>

            <!-- Settings -->
            <div class="settings-row">
                <div class="setting-group">
                    <span class="setting-label">📊 الكمية:</span>
                    <div class="quantity-chips" id="quantityChips">
                        <button class="qty-chip active" data-qty="10">10</button>
                        <button class="qty-chip" data-qty="20">20</button>
                        <button class="qty-chip" data-qty="30">30</button>
                        <button class="qty-chip" data-qty="50">50</button>
                    </div>
                </div>
                <div class="setting-group">
                    <span class="setting-label">🎨 التنسيق:</span>
                    <select class="format-select" id="formatSelect">
                        <option value="e164">E.164 (+966 512 345 678)</option>
                        <option value="withPlus">+ رمز الدولة (+966512345678)</option>
                        <option value="noSpaces">بدون مسافات (966512345678)</option>
                        <option value="local">محلي ببادئة 0 (0512345678)</option>
                    </select>
                </div>
            </div>

            <!-- Generate Button -->
            <button class="btn-generate" id="btnGenerate">🎲 توليد الأرقام</button>
        </div>

        <!-- Results Card -->
        <div class="results-card" id="resultsCard">
            <div class="results-header">
                <span class="results-title" id="resultsTitle">📋 الأرقام المُولّدة</span>
                <button class="btn-copy-all" id="btnCopyAll">📋 نسخ الكل</button>
            </div>
            <div class="numbers-grid" id="numbersGrid"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ==================== COUNTRY DATA ====================
            // Each country: { nameAr, nameEn, code, region, prefixes (NSN prefixes without trunk 0), nsnLen, flag }
            const countriesData = [
                // ===== ARAB WORLD (20) =====
                {
                    nameAr: 'السعودية',
                    nameEn: 'Saudi Arabia',
                    code: '966',
                    region: 'arab',
                    prefixes: ['50', '51', '53', '54', '55', '56', '57', '58', '59'],
                    nsnLen: 9,
                    flag: '🇸🇦'
                },
                {
                    nameAr: 'الإمارات',
                    nameEn: 'UAE',
                    code: '971',
                    region: 'arab',
                    prefixes: ['50', '52', '54', '55', '56', '58'],
                    nsnLen: 9,
                    flag: '🇦🇪'

            const $regionTabs = document.getElementById('regionTabs');
            const $searchInput = document.getElementById('searchInput');
            const $searchClear = document.getElementById('searchClear');
            const $selectedCountry = document.getElementById('selectedCountry');
            const $dropdownArrow = document.getElementById('dropdownArrow');
            const $countryDropdown = document.getElementById('countryDropdown');
            const $countrySelector = document.getElementById('countrySelector');
            const $quantityChips = document.getElementById('quantityChips');
            const $formatSelect = document.getElementById('formatSelect');
            const $btnGenerate = document.getElementById('btnGenerate');
            const $resultsCard = document.getElementById('resultsCard');
            const $resultsTitle = document.getElementById('resultsTitle');
            const $numbersGrid = document.getElementById('numbersGrid');
            const $btnCopyAll = document.getElementById('btnCopyAll');
            const $toast = document.getElementById('toast');

            // ==================== FUNCTIONS ====================

            /** Get filtered countries based on region and search query */
            function getFilteredCountries() {
                let filtered = countriesData;
                if (selectedRegion !== 'all') {
                    filtered = filtered.filter(c => c.region === selectedRegion);
                }
                if (searchQuery.trim()) {
                    const q = searchQuery.trim().toLowerCase();
                    filtered = filtered.filter(c =>
                        c.nameAr.toLowerCase().includes(q) ||
                        c.nameEn.toLowerCase().includes(q) ||
                        c.code.includes(q) ||
                        ('+' + c.code).includes(q)
                    );
                }
                return filtered;
            }

            /** Update the selected country display */
            function updateSelectedCountryDisplay() {
                const c = selectedCountry;
                $selectedCountry.innerHTML = `
                    <span class="flag-area">${c.flag}</span>
                    <span class="info">
                        <span class="name-ar">${c.nameAr}</span>
                        <span class="name-en">${c.nameEn}</span>
                    </span>
                    <span class="code-badge">+${c.code}</span>
                    <span class="dropdown-arrow${dropdownOpen ? ' open' : ''}" id="dropdownArrow">▼</span>
                `;
                // Re-bind arrow reference
                const arrow = $selectedCountry.querySelector('#dropdownArrow');
                if (arrow && dropdownOpen) arrow.classList.add('open');
            }

            /** Render the dropdown list */
            function renderDropdown() {
                const filtered = getFilteredCountries();
                $countryDropdown.innerHTML = '';

                if (filtered.length === 0) {
                    $countryDropdown.innerHTML =
                        '<div class="no-results">❌ لا توجد نتائج مطابقة</div>';
                } else {
                    filtered.forEach(c => {
                        const isSel = c.code === selectedCountry.code && c.nameEn ===
                            selectedCountry.nameEn;
                        const option = document.createElement('div');
                        option.className = 'country-option' + (isSel ? ' selected' : '');
                        option.innerHTML = `
                            <span class="flag-area">${c.flag}</span>
                            <span class="info">
                                <span class="name-ar">${c.nameAr}</span>
                                <span class="name-en">${c.nameEn}</span>
                            </span>
                            <span class="code-badge">+${c.code}</span>
                        `;
                        option.addEventListener('click', () => {
                            selectedCountry = c;
                            updateSelectedCountryDisplay();
                            closeDropdown();
                            // Clear results when changing country
                            clearResults();
                        });
                        $countryDropdown.appendChild(option);
                    });
                }
            }

            function openDropdown() {
                dropdownOpen = true;
                renderDropdown();
                $countryDropdown.classList.add('show');
                const arrow = $selectedCountry.querySelector('#dropdownArrow');
                if (arrow) arrow.classList.add('open');
            }

            function closeDropdown() {
                dropdownOpen = false;
                $countryDropdown.classList.remove('show');
                const arrow = $selectedCountry.querySelector('#dropdownArrow');
                if (arrow) arrow.classList.remove('open');
            }

            function toggleDropdown() {
                if (dropdownOpen) {
                    closeDropdown();
                } else {
                    openDropdown();
                }
            }

            /** Generate a single phone number for the given country */
            function generateNumber(country) {
                // Pick a random prefix
                const prefix = country.prefixes[Math.floor(Math.random() * country.prefixes.length)];
                const remainingLen = country.nsnLen - prefix.length;
                let remainingDigits = '';
                for (let i = 0; i < remainingLen; i++) {
                    remainingDigits += Math.floor(Math.random() * 10);
                }
                const nsn = prefix + remainingDigits; // National Significant Number (no trunk 0)

                return {
                    country: country,
                    nsn: nsn,
                    full: country.code + nsn,
                };
            }

            /** Generate multiple numbers with variety */
            function generateNumbers(country, count) {
                const numbers = [];
                const usedNsns = new Set();

                // Ensure variety by cycling through available prefixes
                const shuffledPrefixes = [...country.prefixes].sort(() => Math.random() - 0.5);

                for (let i = 0; i < count; i++) {
                    let attempts = 0;
                    let num;
                    do {
                        // Cycle through prefixes for variety
                        const prefixIdx = i % shuffledPrefixes.length;
                        const prefix = shuffledPrefixes[prefixIdx];
                        const remainingLen = country.nsnLen - prefix.length;
                        let remainingDigits = '';
                        for (let j = 0; j < remainingLen; j++) {
                            remainingDigits += Math.floor(Math.random() * 10);
                        }
                        const nsn = prefix + remainingDigits;
                        const full = country.code + nsn;
                        attempts++;
                        if (!usedNsns.has(full) || attempts > 20) {
                            usedNsns.add(full);
                            num = { country, nsn, full };
                            break;
                        }
                        // If we've tried too many times, force variety on last digits
                        if (attempts > 15) {
                            const variedRemaining = remainingDigits.split('').map(d =>
                                Math.floor(Math.random() * 10)).join('');
                            const variedNsn = prefix + variedRemaining;
                            const variedFull = country.code + variedNsn;
                            usedNsns.add(variedFull);
                            num = { country, nsn: variedNsn, full: variedFull };
                            break;
                        }
                    } while (attempts < 30);

                    if (!num) {
                        // Fallback with random prefix
                        const rp = country.prefixes[Math.floor(Math.random() * country.prefixes.length)];
                        const rl = country.nsnLen - rp.length;
                        let rd = '';
                        for (let j = 0; j < rl; j++) rd += Math.floor(Math.random() * 10);
                        const rnsn = rp + rd;
                        num = { country, nsn: rnsn, full: country.code + rnsn };
                    }

                    numbers.push(num);
                }
                return numbers;
            }

            /** Format a number according to the selected format */
            function formatNumber(numObj, format) {
                const cc = numObj.country.code;
                const nsn = numObj.nsn;

                switch (format) {
                    case 'e164':
                        // E.164: +CC XXX XXX XXXX (grouped)
                        const groups = [];
                        let remaining = nsn;
                        // Group from right: groups of 3, then remaining
                        const allDigits = nsn.split('');
                        // Simple grouping: first 3, then chunks of 3 from left
                        if (nsn.length <= 4) {
                            groups.push(nsn);
                        } else if (nsn.length <= 7) {
                            groups.push(nsn.substring(0, 3));
                            groups.push(nsn.substring(3));
                        } else {
                            groups.push(nsn.substring(0, 3));
                            const rest = nsn.substring(3);
                            for (let i = 0; i < rest.length; i += 3) {
                                groups.push(rest.substring(i, Math.min(i + 3, rest.length)));
                            }
                        }
                        return '+' + cc + ' ' + groups.join(' ');
                    case 'withPlus':
                        return '+' + cc + nsn;
                    case 'noSpaces':
                        return cc + nsn;
                    case 'local':
                        return '0' + nsn;
                    default:
                        return '+' + cc + ' ' + nsn;
                }
            }

            /** Render results */
            function renderResults() {
                if (generatedNumbers.length === 0) {
                    $resultsCard.classList.remove('visible');
                    return;
                }

                $resultsCard.classList.add('visible');
                $resultsTitle.textContent =
                    `📋 الأرقام المُولّدة — ${selectedCountry.flag} ${selectedCountry.nameAr} (${generatedNumbers.length} رقم)`;

                $numbersGrid.innerHTML = '';
                generatedNumbers.forEach((numObj, idx) => {
                    const formatted = formatNumber(numObj, selectedFormat);
                    const row = document.createElement('div');
                    row.className = 'number-row';
                    row.innerHTML = `
                        <span class="number-text" title="${formatted}">${formatted}</span>
                        <button class="btn-copy-one" data-index="${idx}" title="نسخ الرقم">📋</button>
                    `;
                    $numbersGrid.appendChild(row);
                });

                // Bind copy-one buttons
                $numbersGrid.querySelectorAll('.btn-copy-one').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const idx = parseInt(this.getAttribute('data-index'));
                        const formatted = formatNumber(generatedNumbers[idx],
                            selectedFormat);
                        copyToClipboard(formatted);
                        this.classList.add('copied');
                        this.textContent = '✓';
                        showToast('✅ تم نسخ الرقم');
                        setTimeout(() => {
                            this.classList.remove('copied');
                            this.textContent = '📋';
                        }, 1500);
                    });
                });

                // Scroll to results
                $resultsCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            function clearResults() {
                generatedNumbers = [];
                $resultsCard.classList.remove('visible');
                $numbersGrid.innerHTML = '';
            }

            /** Copy text to clipboard */
            function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).catch(() => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                ta.style.top = '-9999px';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                try {
                    document.execCommand('copy');
                } catch (e) {
                    // ignore
                }
                document.body.removeChild(ta);
            }

            /** Show toast notification */
            function showToast(message, duration = 2000) {
                $toast.textContent = message;
                $toast.className = 'toast success show';
                clearTimeout($toast._timeout);
                $toast._timeout = setTimeout(() => {
                    $toast.classList.remove('show');
                }, duration);
            }

            // ==================== EVENT LISTENERS ====================

            // Region tabs
            $regionTabs.addEventListener('click', function(e) {
                const tab = e.target.closest('.region-tab');
                if (!tab) return;
                const region = tab.getAttribute('data-region');
                selectedRegion = region;

                // Update active tab
                $regionTabs.querySelectorAll('.region-tab').forEach(t => t.classList.remove(
                    'active'));
                tab.classList.add('active');

                // If current country not in region, select first available
                const filtered = getFilteredCountries();
                if (filtered.length > 0) {
                    const inRegion = filtered.find(c => c.code === selectedCountry.code && c
                        .nameEn === selectedCountry.nameEn);
                    if (!inRegion) {
                        selectedCountry = filtered[0];
                        updateSelectedCountryDisplay();
                    }
                }
                clearResults();
                if (dropdownOpen) {
                    renderDropdown();
                }
            });

            // Search input
            $searchInput.addEventListener('input', function() {
                searchQuery = this.value;
                if (searchQuery.trim()) {
                    $searchClear.classList.add('visible');
                } else {
                    $searchClear.classList.remove('visible');
                }
                if (dropdownOpen) {
                    renderDropdown();
                }
                // Auto-select first match if dropdown closed
                const filtered = getFilteredCountries();
                if (filtered.length > 0 && searchQuery.trim()) {
                    const currentInFiltered = filtered.find(c => c.code === selectedCountry.code && c
                        .nameEn === selectedCountry.nameEn);
                    if (!currentInFiltered) {
                        selectedCountry = filtered[0];
                        updateSelectedCountryDisplay();
                        clearResults();
                    }
                }
            });

            $searchClear.addEventListener('click', function() {
                searchQuery = '';
                $searchInput.value = '';
                $searchClear.classList.remove('visible');
                if (dropdownOpen) {
                    renderDropdown();
                }
                $searchInput.focus();
            });

            // Country selector click
            $selectedCountry.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleDropdown();
            });

            // Close dropdown on outside click
            document.addEventListener('click', function(e) {
                if (!$countrySelector.contains(e.target)) {
                    closeDropdown();
                }
            });

            // Quantity chips
            $quantityChips.addEventListener('click', function(e) {
                const chip = e.target.closest('.qty-chip');
                if (!chip) return;
                selectedQuantity = parseInt(chip.getAttribute('data-qty'));
                $quantityChips.querySelectorAll('.qty-chip').forEach(c => c.classList.remove(
                    'active'));
                chip.classList.add('active');
            });

            // Format select
            $formatSelect.addEventListener('change', function() {
                selectedFormat = this.value;
                if (generatedNumbers.length > 0) {
                    renderResults();
                }
            });

            // Generate button
            $btnGenerate.addEventListener('click', function() {
                if (!selectedCountry) {
                    showToast('⚠️ الرجاء اختيار دولة أولاً');
                    return;
                }
                $btnGenerate.disabled = true;
                $btnGenerate.textContent = '⏳ جارٍ التوليد...';

                // Small delay for UI feedback
                setTimeout(() => {
                    generatedNumbers = generateNumbers(selectedCountry, selectedQuantity);
                    renderResults();
                    $btnGenerate.disabled = false;
                    $btnGenerate.textContent = '🎲 توليد الأرقام';
                    showToast(
                        `✅ تم توليد ${generatedNumbers.length} رقم — ${selectedCountry.flag} ${selectedCountry.nameAr}`
                        );
                }, 150);
            });

            // Copy all button
            $btnCopyAll.addEventListener('click', function() {
                if (generatedNumbers.length === 0) return;
                const allNumbers = generatedNumbers.map(n => formatNumber(n, selectedFormat)).join(
                    '\n');
                copyToClipboard(allNumbers);
                $btnCopyAll.classList.add('copied');
                $btnCopyAll.textContent = '✓ تم النسخ!';
                showToast(`📋 تم نسخ ${generatedNumbers.length} رقم دفعة واحدة`);
                setTimeout(() => {
                    $btnCopyAll.classList.remove('copied');
                    $btnCopyAll.textContent = '📋 نسخ الكل';
                }, 2000);
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                // Escape to close dropdown
                if (e.key === 'Escape' && dropdownOpen) {
                    closeDropdown();
                }
                // Ctrl+Enter to generate
                if (e.ctrlKey && e.key === 'Enter') {
                    $btnGenerate.click();
                }
                // Ctrl+K to focus search
                if (e.ctrlKey && e.key === 'k') {
                    e.preventDefault();
                    $searchInput.focus();
                }
            });

            // ==================== INITIALIZATION ====================
            function init() {
                updateSelectedCountryDisplay();
                renderDropdown();
                // Set initial quantity
                $quantityChips.querySelector('[data-qty="10"]').classList.add('active');
                // Set initial format
                $formatSelect.value = 'e164';
                selectedFormat = 'e164';
            }

            init();

            console.log('🌍 المولّد العالمي لأرقام الهواتف جاهز | Universal Phone Number Generator Ready');
            console.log('📊 92 دولة | 5 مناطق | بادئات شبكات فعلية');
            console.log('💡 اختصارات: Ctrl+K للبحث | Ctrl+Enter للتوليد | Esc للإغلاق');
        })();
    </script>
</body>
</html>
